name: Release

# Publishing a release on GitHub builds the DMG and attaches it,
# which is what the in-app updater downloads.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v2.1
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the version matches the tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" KMHD-Menu-Bar-Player/Info.plist)
          if [ "v$version" != "$TAG" ]; then
            echo "Info.plist says $version but the release tag is $TAG"
            exit 1
          fi

      - name: Build
        run: ./build.sh --dmg

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/KMHD-Menu-Bar-Player.dmg --clobber
